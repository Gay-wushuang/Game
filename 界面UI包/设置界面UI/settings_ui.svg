<?xml version="1.0" encoding="UTF-8"?>
<!-- 设置界面 UI 蓝图 (720p 1280x720) — 矢量分层版 -->
<!-- 每个 <g> 为一个 UI 区块，半透明块仅圈定范围，供后期替换为真实素材 -->
<!-- 图层顺序：背景(渐变,最底) -> 色块 -> 文字(最顶) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- 背景渐变 (瓦风格深色) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset="1" stop-color="#1F2A38"/>
    </linearGradient>
  </defs>

  <!-- ========== 背景层（渐变, 最底） ========== -->
  <g id="背景">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  </g>

  <!-- ========== 返回键层 (左上角) ========== -->
  <g id="返回键">
    <rect x="30" y="40" width="110" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="56" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">返回</text>
  </g>

  <!-- ========== 顶部设置按钮层 (x5, 180x78, 间隔20) ========== -->
  <g id="顶部设置按钮">
    <!-- 设置项 1 -->
    <rect x="150" y="60" width="180" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="150" y="60" width="6" height="78" fill="#FF4655" fill-opacity="0.70"/>
    <text x="190" y="112" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置项 1</text>
    <!-- 设置项 2 -->
    <rect x="350" y="60" width="180" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="350" y="60" width="6" height="78" fill="#FF4655" fill-opacity="0.70"/>
    <text x="390" y="112" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置项 2</text>
    <!-- 设置项 3 -->
    <rect x="550" y="60" width="180" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="550" y="60" width="6" height="78" fill="#FF4655" fill-opacity="0.70"/>
    <text x="590" y="112" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置项 3</text>
    <!-- 设置项 4 -->
    <rect x="750" y="60" width="180" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="750" y="60" width="6" height="78" fill="#FF4655" fill-opacity="0.70"/>
    <text x="790" y="112" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置项 4</text>
    <!-- 设置项 5 -->
    <rect x="950" y="60" width="180" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="950" y="60" width="6" height="78" fill="#FF4655" fill-opacity="0.70"/>
    <text x="990" y="112" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置项 5</text>
  </g>

  <!-- ========== 设置内容占位层 ========== -->
  <g id="设置内容占位">
    <rect x="150" y="180" width="980" height="440" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="150" y="180" width="980" height="2" fill="#FF4655" fill-opacity="0.60"/>
    <text x="180" y="228" font-size="24" font-weight="bold" fill="#FF4655" font-family="Arial, 'Microsoft YaHei', sans-serif">设置内容</text>
    <text x="180" y="318" font-size="18" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置内容占位区域</text>
  </g>
</svg>
