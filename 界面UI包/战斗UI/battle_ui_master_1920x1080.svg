<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Battle UI Master 1920x1080</title>
  <desc>Geometry reference for the Godot battle UI. Do not use this SVG as one monolithic interactive texture.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f7}.panel{fill:#fff;stroke:#222;stroke-width:2}.sub{fill:#f1f1f1;stroke:#555;stroke-width:1.5}
      .battle{fill:#fbfbfb;stroke:#111;stroke-width:2.5}.enemy{fill:#f5eaea;stroke:#8b3a3a;stroke-width:1.5}
      .player{fill:#eaf0f7;stroke:#385a83;stroke-width:1.5}.slot{fill:#ececec;stroke:#666;stroke-width:1.2}
      .hand{fill:#f4f4f4;stroke:#333;stroke-width:2}.card{fill:#fff;stroke:#555;stroke-width:1.5}.sel{fill:#fff8db;stroke:#c48a00;stroke-width:4}
      .guide{fill:none;stroke:#999;stroke-width:1;stroke-dasharray:7 7}.title{font:700 24px sans-serif;fill:#111}
      .label{font:600 18px sans-serif;fill:#222}.small{font:14px sans-serif;fill:#444}.tiny{font:12px sans-serif;fill:#555}.id{font:12px monospace;fill:#555}
    </style>
  </defs>
  <rect id="Canvas" class="bg" x="0" y="0" width="1920" height="1080"/>
  <rect id="SafeArea" class="guide" x="16" y="16" width="1888" height="1048"/>

  <g id="TopBar">
    <rect class="panel" x="16" y="16" width="1888" height="64" rx="4"/>
    <rect id="TopBar_StageInfo" class="sub" x="28" y="24" width="500" height="48"/><text x="48" y="55" class="label">场景 / 回合</text>
    <rect id="TopBar_PhaseInfo" class="sub" x="540" y="24" width="760" height="48"/><text x="790" y="55" class="label">当前阶段 / 操作引导</text>
    <rect id="TopBar_AP" class="sub" x="1312" y="24" width="180" height="48"/><text x="1355" y="55" class="label">AP 3/5</text>
    <rect id="TopBar_Log" class="sub" x="1504" y="24" width="180" height="48"/><text x="1544" y="55" class="label">战斗日志</text>
    <rect id="TopBar_Settings" class="sub" x="1696" y="24" width="196" height="48"/><text x="1750" y="55" class="label">设置</text>
  </g>

  <g id="LeftSidebar">
    <rect class="panel" x="16" y="88" width="240" height="976" rx="4"/>
    <text x="64" y="120" class="title">左侧稳定信息栏</text>
    <rect id="Left_Faction" class="sub" x="28" y="136" width="216" height="188"/><text x="82" y="170" class="label">阵营信息</text><text x="48" y="214" class="small">我方阵营</text><text x="107" y="248" class="label">VS</text><text x="48" y="286" class="small">敌方阵营</text>
    <rect id="Left_AP" class="sub" x="28" y="340" width="216" height="84"/><text x="46" y="374" class="label">AP</text><text x="176" y="374" class="label">3/5</text><text x="46" y="404" class="small">当前行动点</text>
    <rect id="Left_HeroDeck" class="sub" x="28" y="440" width="216" height="90"/><text x="46" y="476" class="label">英雄牌库</text><text x="192" y="476" class="label">15</text>
    <rect id="Left_DrawPile" class="sub" x="28" y="544" width="216" height="90"/><text x="46" y="580" class="label">抽牌堆</text><text x="192" y="580" class="label">26</text>
    <rect id="Left_DiscardPile" class="sub" x="28" y="648" width="216" height="90"/><text x="46" y="684" class="label">弃牌堆</text><text x="192" y="684" class="label">2</text>
    <rect id="Left_TotalCards" class="sub" x="28" y="752" width="216" height="90"/><text x="46" y="788" class="label">战术牌总数</text><text x="192" y="788" class="label">43</text>
    <rect id="Left_Reserved" class="sub" x="28" y="856" width="216" height="192"/><text x="50" y="896" class="small">预留：Boss / 章节特殊资源</text><text x="50" y="932" class="small">默认无内容时隐藏内部元素</text><text x="50" y="980" class="id">Left.Reserved</text>
  </g>

  <g id="Battlefield">
    <rect class="battle" x="264" y="88" width="1280" height="700" rx="4"/>
    <text x="650" y="122" class="title">Battlefield · 5v5 · 常驻 UI 不得覆盖角色主体</text>
    <line class="guide" x1="288" y1="426" x2="1520" y2="426"/>
    <rect id="Battlefield_FXSafeZone" class="guide" x="288" y="146" width="1232" height="582"/>
    <text x="1190" y="748" class="tiny">Battlefield_FXSafeZone</text>

    <g id="EnemySlots">
      <g id="EnemySlot01"><rect class="enemy" x="304" y="172" width="224" height="228" rx="8"/><text x="400" y="202" class="label">E1</text><rect class="slot" x="326" y="216" width="180" height="128"/><rect class="slot" x="462" y="354" width="40" height="34"/><text x="362" y="382" class="small">HP / 状态</text></g>
      <g id="EnemySlot02"><rect class="enemy" x="544" y="172" width="224" height="228" rx="8"/><text x="640" y="202" class="label">E2</text><rect class="slot" x="566" y="216" width="180" height="128"/><rect class="slot" x="702" y="354" width="40" height="34"/><text x="602" y="382" class="small">HP / 状态</text></g>
      <g id="EnemySlot03"><rect class="enemy" x="784" y="172" width="224" height="228" rx="8"/><text x="880" y="202" class="label">E3</text><rect class="slot" x="806" y="216" width="180" height="128"/><rect class="slot" x="942" y="354" width="40" height="34"/><text x="842" y="382" class="small">HP / 状态</text></g>
      <g id="EnemySlot04"><rect class="enemy" x="1024" y="172" width="224" height="228" rx="8"/><text x="1120" y="202" class="label">E4</text><rect class="slot" x="1046" y="216" width="180" height="128"/><rect class="slot" x="1182" y="354" width="40" height="34"/><text x="1082" y="382" class="small">HP / 状态</text></g>
      <g id="EnemySlot05"><rect class="enemy" x="1264" y="172" width="224" height="228" rx="8"/><text x="1360" y="202" class="label">E5</text><rect class="slot" x="1286" y="216" width="180" height="128"/><rect class="slot" x="1422" y="354" width="40" height="34"/><text x="1322" y="382" class="small">HP / 状态</text></g>
    </g>

    <g id="PlayerSlots">
      <g id="PlayerSlot01"><rect class="player" x="304" y="476" width="224" height="228" rx="8"/><text x="400" y="506" class="label">P1</text><rect class="slot" x="326" y="520" width="180" height="128"/><rect class="slot" x="462" y="658" width="40" height="34"/><text x="362" y="686" class="small">HP / 状态</text></g>
      <g id="PlayerSlot02"><rect class="player" x="544" y="476" width="224" height="228" rx="8"/><text x="640" y="506" class="label">P2</text><rect class="slot" x="566" y="520" width="180" height="128"/><rect class="slot" x="702" y="658" width="40" height="34"/><text x="602" y="686" class="small">HP / 状态</text></g>
      <g id="PlayerSlot03"><rect class="player" x="784" y="476" width="224" height="228" rx="8"/><text x="880" y="506" class="label">P3</text><rect class="slot" x="806" y="520" width="180" height="128"/><rect class="slot" x="942" y="658" width="40" height="34"/><text x="842" y="686" class="small">HP / 状态</text></g>
      <g id="PlayerSlot04"><rect class="player" x="1024" y="476" width="224" height="228" rx="8"/><text x="1120" y="506" class="label">P4</text><rect class="slot" x="1046" y="520" width="180" height="128"/><rect class="slot" x="1182" y="658" width="40" height="34"/><text x="1082" y="686" class="small">HP / 状态</text></g>
      <g id="PlayerSlot05"><rect class="player" x="1264" y="476" width="224" height="228" rx="8"/><text x="1360" y="506" class="label">P5</text><rect class="slot" x="1286" y="520" width="180" height="128"/><rect class="slot" x="1422" y="658" width="40" height="34"/><text x="1322" y="686" class="small">HP / 状态</text></g>
    </g>
  </g>

  <g id="HandArea">
    <rect class="hand" x="264" y="796" width="1280" height="268" rx="4"/>
    <text x="290" y="828" class="label">HandArea · 1~8张 · 动态扇形</text>
    <g id="HandFanGuide">
      <g transform="translate(384 850) rotate(-8 92 98)"><rect class="card" width="184" height="196" rx="8"/><text x="72" y="30" class="label">C1</text></g>
      <g transform="translate(558 832) rotate(-4 92 102)"><rect class="card" width="184" height="204" rx="8"/><text x="72" y="30" class="label">C2</text></g>
      <g transform="translate(742 814)"><rect class="sel" width="200" height="226" rx="8"/><text x="62" y="32" class="label">SELECT</text><text x="28" y="62" class="tiny">hover: y-18 / scale1.05 / rot0</text></g>
      <g transform="translate(954 832) rotate(4 92 102)"><rect class="card" width="184" height="204" rx="8"/><text x="72" y="30" class="label">C4</text></g>
      <g transform="translate(1128 850) rotate(8 92 98)"><rect class="card" width="184" height="196" rx="8"/><text x="72" y="30" class="label">C5</text></g>
    </g>
  </g>

  <g id="RightSidebar">
    <rect class="panel" x="1552" y="88" width="352" height="976" rx="4"/>
    <text x="1614" y="120" class="title">右侧状态面板</text>
    <g id="Right_DefaultCommanderView">
      <rect class="sub" x="1568" y="136" width="320" height="500"/>
      <text x="1606" y="168" class="label">默认态：双方玩家 / 指挥官</text>
      <rect id="Right_PlayerCommander" class="player" x="1586" y="188" width="284" height="172" rx="8"/><circle cx="1644" cy="244" r="40" fill="#ddd" stroke="#555"/><text x="1700" y="230" class="label">我方玩家</text><text x="1700" y="260" class="small">名称 / 等级 / 阵营</text>
      <text x="1706" y="404" class="title">VS</text>
      <rect id="Right_EnemyCommander" class="enemy" x="1586" y="432" width="284" height="172" rx="8"/><circle cx="1644" cy="488" r="40" fill="#ddd" stroke="#555"/><text x="1700" y="474" class="label">敌方玩家</text><text x="1700" y="504" class="small">名称 / 等级 / 阵营</text>
    </g>
    <rect id="Right_DetailView" class="guide" x="1568" y="136" width="320" height="500"/><text x="1584" y="654" class="tiny">Right.DetailView 与 DefaultCommanderView 完全同位；右键切换，不改变布局。</text>
    <rect id="Right_Command_Skill" class="sub" x="1568" y="676" width="320" height="92" rx="6"/><text x="1636" y="732" class="title">使用英雄技能</text>
    <rect id="Right_Command_Cancel" class="sub" x="1568" y="784" width="320" height="92" rx="6"/><text x="1662" y="840" class="title">取消选择</text>
    <rect id="Right_Command_EndTurn" class="sub" x="1568" y="892" width="320" height="156" rx="6"/><text x="1662" y="974" class="title">结束回合</text>
  </g>

  <text x="270" y="1054" class="tiny">Master geometry: Left 240px · Center 1280px · Right 352px · TopBar 64px · Battlefield 700px · HandArea 268px</text>
</svg>
