<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Battle UI Graybox v1.0 — Layout Frozen</title>
  <desc>Godot battle scene visual reference. Interactive text and values remain runtime UI, not baked artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/><stop offset=".55" stop-color="#0b1c2a"/><stop offset="1" stop-color="#111624"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b24"/><stop offset=".48" stop-color="#17222d"/><stop offset=".52" stop-color="#121c27"/><stop offset="1" stop-color="#0e1822"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26384c"/><stop offset="1" stop-color="#121c29"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#e8f0f7}
      .title{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#a9bdcc}.tiny{font-size:12px;fill:#8fa8ba}
      .panel{fill:#101820;stroke:#29475e;stroke-width:2}.weak{fill:#0c151f;stroke:#1c3448;stroke-width:1.5}
      .slot{fill:#12202e;stroke:#3d6684;stroke-width:2}.hpbg{fill:#070c12}.hp{fill:#35c775}.accent{fill:#48caff}
      .card{fill:url(#card);stroke:#577897;stroke-width:2}.back{fill:#10243a;stroke:#5ecfff;stroke-width:2}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M0 250 Q480 110 960 250 T1920 250 V700 Q1440 600 960 700 T0 700Z" fill="#142a36" opacity=".22"/>
  <path d="M260 525 H1590" stroke="#4b7f9d" stroke-width="2" opacity=".18"/>

  <!-- TopBar 1888×64 -->
  <g id="top_bar">
    <rect x="16" y="16" width="1888" height="64" rx="8" fill="#09131e" opacity=".78"/>
    <text x="32" y="56" class="title">训练场 · 第 1 回合</text>
    <text x="760" y="55" class="label" fill="#57d0ff">打开英雄卡包，选择英雄并部署到我方空位</text>
    <rect x="1516" y="24" width="180" height="48" rx="7" class="weak"/><text x="1569" y="55" class="label">战斗日志</text>
    <rect x="1708" y="24" width="196" height="48" rx="7" class="weak"/><text x="1784" y="55" class="label">设置</text>
  </g>

  <!-- Left HUD Rail 240×976 -->
  <g id="left_hud">
    <rect x="16" y="88" width="240" height="976" rx="10" fill="#08121d" opacity=".66"/>
    <rect x="28" y="100" width="216" height="128" rx="8" class="weak"/>
    <text x="94" y="132" class="label">◆ 敌方 ↑</text><text x="123" y="170" class="small">VS</text><text x="94" y="212" class="label">◇ 我方 ↓</text>

    <!-- Independent passive gate; no passive card occupies hero slots -->
    <g id="passive_gate">
      <rect x="28" y="240" width="216" height="548" rx="10" fill="#0b1622" stroke="#31536d" stroke-width="2"/>
      <text x="48" y="276" class="label">被动战门</text><text x="194" y="276" class="small">3</text>
      <text x="48" y="304" class="tiny">卡背叠瓦 · 点击展开己方伏牌</text>
      <g transform="translate(72 340)">
        <rect width="72" height="96" rx="6" class="back"/>
        <path d="M12 16 L60 80 M60 16 L12 80" stroke="#54badf" stroke-width="3" opacity=".45"/>
      </g>
      <g transform="translate(82 402)">
        <rect width="72" height="96" rx="6" class="back"/>
        <path d="M12 16 L60 80 M60 16 L12 80" stroke="#54badf" stroke-width="3" opacity=".45"/>
      </g>
      <g transform="translate(92 464)">
        <rect width="72" height="96" rx="6" class="back"/>
        <path d="M12 16 L60 80 M60 16 L12 80" stroke="#54badf" stroke-width="3" opacity=".45"/>
      </g>
      <text x="65" y="602" class="small">展开尺寸仍保持 3:4</text>
      <text x="67" y="630" class="tiny">战门位置不绑定任何英雄</text>
    </g>

    <g id="resource_dock">
      <rect x="54" y="932" width="78" height="56" rx="7" class="weak"/><text x="72" y="968" class="label">♛ 4</text>
      <rect x="140" y="932" width="78" height="56" rx="7" class="weak"/><text x="158" y="968" class="label">▣ 26</text>
      <rect x="54" y="996" width="78" height="56" rx="7" class="weak"/><text x="72" y="1032" class="label">▨ 0</text>
      <rect x="140" y="996" width="78" height="56" rx="7" class="weak"/><text x="158" y="1032" class="label">◇ 30</text>
    </g>
  </g>

  <!-- Battlefield 1328×700 -->
  <g id="battlefield">
    <rect x="264" y="88" width="1328" height="700" rx="10" fill="url(#field)" stroke="#263f53" stroke-width="2"/>
    <text x="286" y="122" class="small">敌方战线</text><text x="286" y="764" class="small">我方战线</text>

    <!-- Each slot is 224×228; portrait canvas inside is 128×160 -->
    <g id="enemy_slots" transform="translate(336 156)">
      <g transform="translate(0)"><rect width="224" height="228" rx="10" class="slot"/><rect x="48" y="12" width="128" height="160" rx="5" fill="#233547"/><path d="M112 40 q-38 14-38 58v56h76V98q0-44-38-58Z" fill="#72879a" opacity=".58"/><rect x="22" y="188" width="180" height="12" rx="6" class="hpbg"/><rect x="22" y="188" width="132" height="12" rx="6" class="hp"/><text x="76" y="220" class="tiny">HP 24/32 · ★2</text></g>
      <g transform="translate(240)"><rect width="224" height="228" rx="10" class="slot"/><rect x="48" y="12" width="128" height="160" rx="5" fill="#233547"/><path d="M112 40 q-38 14-38 58v56h76V98q0-44-38-58Z" fill="#72879a" opacity=".58"/><rect x="22" y="188" width="180" height="12" rx="6" class="hpbg"/><rect x="22" y="188" width="168" height="12" rx="6" class="hp"/><text x="76" y="220" class="tiny">HP 30/32 · ★1</text></g>
      <rect x="480" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="570" y="120" class="small">空位</text>
      <rect x="720" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="810" y="120" class="small">空位</text>
      <rect x="960" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="1050" y="120" class="small">空位</text>
    </g>

    <g id="ally_slots" transform="translate(336 460)">
      <g filter="url(#glow)"><rect width="224" height="228" rx="10" fill="#122536" stroke="#5bd4ff" stroke-width="3"/><rect x="48" y="12" width="128" height="160" rx="5" fill="#27445a"/><path d="M112 36 q-42 18-42 62v58h84V98q0-44-42-62Z" fill="#86b8d1" opacity=".7"/><rect x="22" y="188" width="180" height="12" rx="6" class="hpbg"/><rect x="22" y="188" width="154" height="12" rx="6" class="hp"/><text x="72" y="220" class="tiny">HP 27/32 · ★2</text></g>
      <g transform="translate(240)"><rect width="224" height="228" rx="10" class="slot"/><rect x="48" y="12" width="128" height="160" rx="5" fill="#233547"/><path d="M112 40 q-38 14-38 58v56h76V98q0-44-38-58Z" fill="#72879a" opacity=".58"/><rect x="22" y="188" width="180" height="12" rx="6" class="hpbg"/><rect x="22" y="188" width="180" height="12" rx="6" class="hp"/><text x="76" y="220" class="tiny">HP 32/32 · ★1</text></g>
      <rect x="480" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="570" y="120" class="small">空位</text>
      <rect x="720" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="810" y="120" class="small">空位</text>
      <rect x="960" width="224" height="228" rx="10" class="slot" opacity=".72"/><text x="1050" y="120" class="small">空位</text>
    </g>
  </g>

  <!-- HandArea 1328×268; cards are native 168×224 -->
  <g id="hand_area">
    <rect x="264" y="796" width="1328" height="268" rx="10" fill="#0c141e" stroke="#263f53" stroke-width="2"/>
    <text x="280" y="824" class="label">手牌</text>
    <g transform="translate(520 832)">
      <g transform="rotate(-7 84 112)"><rect width="168" height="224" rx="10" class="card"/><text x="16" y="30" class="small">AP 2</text><rect x="12" y="42" width="144" height="96" rx="5" fill="#314b62"/><text x="51" y="170" class="label">主动锦囊</text></g>
      <g transform="translate(150 -8) rotate(-3 84 112)"><rect width="168" height="224" rx="10" class="card"/><text x="16" y="30" class="small">AP 1</text><rect x="12" y="42" width="144" height="96" rx="5" fill="#314b62"/><text x="51" y="170" class="label">被动锦囊</text></g>
      <g transform="translate(300 -8) rotate(3 84 112)"><rect width="168" height="224" rx="10" class="card"/><text x="16" y="30" class="small">AP 2</text><rect x="12" y="42" width="144" height="96" rx="5" fill="#314b62"/><text x="51" y="170" class="label">主动锦囊</text></g>
      <g transform="translate(450) rotate(7 84 112)"><rect width="168" height="224" rx="10" class="card"/><text x="16" y="30" class="small">AP 0</text><rect x="12" y="42" width="144" height="96" rx="5" fill="#314b62"/><text x="51" y="170" class="label">被动锦囊</text></g>
    </g>
  </g>

  <!-- Right contextual rail 304×976 -->
  <g id="right_sidebar">
    <rect x="1600" y="88" width="304" height="976" rx="10" fill="#0d151f" stroke="#253c4e" stroke-width="2"/>
    <rect x="1612" y="136" width="280" height="500" rx="9" class="weak"/>
    <text x="1698" y="208" class="label">敌方指挥官</text><text x="1708" y="240" class="small">公开状态 / 意图</text>
    <text x="1724" y="390" class="small">──── VS ────</text>
    <text x="1698" y="506" class="label">我方指挥官</text><text x="1708" y="538" class="small">状态：正常</text>
    <circle cx="1752" cy="946" r="82" fill="#101d2a" stroke="#42caff" stroke-width="8"/>
    <text x="1709" y="938" class="label">AP 5/5</text><text x="1709" y="978" class="label">结束回合</text>
  </g>

  <text x="1610" y="1052" class="tiny">1920×1080 · Battle UI Graybox v1.0 · Layout Frozen</text>
</svg>
