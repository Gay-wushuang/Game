<?xml version="1.0" encoding="UTF-8"?>
<!-- 模式选择 UI 蓝图 (720p 1280x720) — 矢量分层版 -->
<!-- 每个 <g> 为一个 UI 区块，半透明块仅圈定范围，供后期替换为真实素材 -->
<!-- 图层顺序：背景 -> 模式按钮(图片占位+渐变+顶线+文字) -> 底部信息栏 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- 背景渐变 (瓦风格深色) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset="1" stop-color="#1F2A38"/>
    </linearGradient>
    <!-- 按钮渐变: 从上到下 深蓝 -> 无色透明, 覆盖整个按钮 -->
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset="1" stop-color="#0F1923" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ========== 背景层 ========== -->
  <g id="背景">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  </g>

  <!-- ========== 返回键层 (左上角) ========== -->
  <g id="返回键">
    <rect x="30" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="60" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">返回</text>
  </g>

  <!-- ========== 模式按钮层 (x4, 纵向, 横向均匀排列) ========== -->
  <g id="模式按钮">
    <!-- ===== 故事模式 ===== -->
    <g id="按钮_故事模式">
      <!-- 底层: 图片占位 -->
      <rect x="80" y="140" width="220" height="470" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="80" y="140" width="220" height="470" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="190" y="430" font-size="20" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">图片占位</text>
      <!-- 渐变覆盖层 -->
      <rect x="80" y="140" width="220" height="470" fill="url(#btnGrad)"/>
      <!-- 顶部红条 -->
      <rect x="80" y="140" width="220" height="6" fill="#FF4655"/>
      <!-- 模式名文字 (按钮上半部中央) -->
      <text x="190" y="215" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">故事模式</text>
    </g>

    <!-- ===== 挑战模式 ===== -->
    <g id="按钮_挑战模式">
      <rect x="380" y="140" width="220" height="470" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="380" y="140" width="220" height="470" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="490" y="430" font-size="20" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">图片占位</text>
      <rect x="380" y="140" width="220" height="470" fill="url(#btnGrad)"/>
      <rect x="380" y="140" width="220" height="6" fill="#FF4655"/>
      <text x="490" y="215" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">挑战模式</text>
    </g>

    <!-- ===== 竞技场 ===== -->
    <g id="按钮_竞技场">
      <rect x="680" y="140" width="220" height="470" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="680" y="140" width="220" height="470" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="790" y="430" font-size="20" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">图片占位</text>
      <rect x="680" y="140" width="220" height="470" fill="url(#btnGrad)"/>
      <rect x="680" y="140" width="220" height="6" fill="#FF4655"/>
      <text x="790" y="215" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">竞技场</text>
    </g>

    <!-- ===== pvp 模式 ===== -->
    <g id="按钮_pvp模式">
      <rect x="980" y="140" width="220" height="470" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="980" y="140" width="220" height="470" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="1090" y="430" font-size="20" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">图片占位</text>
      <rect x="980" y="140" width="220" height="470" fill="url(#btnGrad)"/>
      <rect x="980" y="140" width="220" height="6" fill="#FF4655"/>
      <text x="1090" y="215" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">pvp 模式</text>
    </g>
  </g>

  <!-- ========== 底部信息栏层 (与主界面一致) ========== -->
  <g id="底部信息栏">
    <!-- 底栏背景 + 顶线 -->
    <rect x="0" y="640" width="1280" height="80" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="0" y="640" width="1280" height="2" fill="#FFFFFF" fill-opacity="0.60"/>

    <!-- 版本号 -->
    <text x="0" y="628" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">v0.1.0</text>

    <!-- 玩家名称块 -->
    <rect x="0" y="642" width="170" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="49" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">玩家名称</text>
    <!-- 分割线 -->
    <rect x="168" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>

    <!-- 等级 -->
    <rect x="170" y="642" width="170" height="39" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="241" y="666" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">等级</text>
    <!-- 分割线 -->
    <rect x="170" y="679" width="170" height="2" fill="#FFFFFF" fill-opacity="0.60"/>
    <!-- 经验 -->
    <rect x="170" y="681" width="170" height="39" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="241" y="705" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">经验</text>
    <!-- 分割线 -->
    <rect x="339" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>

    <!-- 货币区 -->
    <text x="616" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>
    <text x="726" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>
    <text x="836" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>

    <!-- 分割线 -->
    <rect x="1200" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>
    <!-- 设置 -->
    <rect x="1202" y="642" width="78" height="78" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="1229" y="683" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置</text>
  </g>
</svg>