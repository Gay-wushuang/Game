<?xml version="1.0" encoding="UTF-8"?>
<!-- 研发中心 UI 蓝图 (720p 1280x720) — 技能单元网格版 -->
<!-- 结构: 左上返回键 / 顶部tab(技能·装饰) / 中间技能面板(3列x2行=6单元, 每单元=名称+等级+加减按钮+描述) / 底部信息栏 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset="1" stop-color="#1F2A38"/>
    </linearGradient>
  </defs>

  <g id="背景">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  </g>

  <!-- ========== 左上返回键 ========== -->
  <g id="返回键">
    <rect x="30" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="60" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">返回</text>
  </g>

  <!-- ========== 顶部tab: 技能 / 装饰 (同尺寸同结构, 文字统一居中) ========== -->
  <g id="顶部tab">
    <!-- 技能 (选中态, 红填充 + 红条, 白字) -->
    <rect x="210" y="40" width="150" height="48" fill="#FF4655" fill-opacity="0.80"/>
    <rect x="210" y="40" width="6" height="48" fill="#FF4655"/>
    <text x="285" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">技能</text>
    <!-- 装饰 (未选中, 白底 + 红条, 白字) -->
    <rect x="360" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="360" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="435" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">装饰</text>
  </g>

  <!-- ========== 技能面板 (x30 y118 w1220 h492 → 下边610, 四周边距30与商店一致) ========== -->
  <g id="技能面板">
    <rect x="30" y="118" width="1220" height="492" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="118" width="1220" height="492" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="30" y="118" width="1220" height="4" fill="#FF4655" fill-opacity="0.80"/>

    <!-- 技能单元网格: 3列x2行, 内容区 x60~1220(1160宽) y148~580(432高), 列间隔30 行间隔30 -->
    <!-- 单元宽366.67 高201 -->

    <!-- ===== 行1 ===== -->
    <!-- 单元1 -->
