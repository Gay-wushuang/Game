<?xml version="1.0" encoding="UTF-8"?>
<!-- 备战中心 UI 蓝图 (720p 1280x720) — 选卡+卡组预览 -->
<!-- 结构: 左上返回键 / 中间选卡面板(2行x5列=10卡, 第一张选中态) / 右侧卡组预览面板(顶部分类栏+预览信息) / 底部信息栏 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset="1" stop-color="#1F2A38"/>
    </linearGradient>
  </defs>

  <g id="背景">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  </g>

  <!-- ========== 左上返回键 ========== -->
  <g id="返回键">
    <rect x="30" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="60" y="72" font-size="22" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">返回</text>
  </g>

  <!-- ========== 顶部分类栏 (横排, 返回键右侧, 选中态红色) ========== -->
  <g id="顶部分类栏">
    <rect x="210" y="40" width="150" height="48" fill="#FF4655" fill-opacity="0.80"/>
    <text x="285" y="72" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">全部</text>
    <rect x="360" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="360" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="435" y="72" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">英雄卡</text>
    <rect x="510" y="40" width="150" height="48" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="510" y="40" width="6" height="48" fill="#FF4655" fill-opacity="0.70"/>
    <text x="585" y="72" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">锦囊卡</text>
  </g>

  <!-- ========== 中间选卡面板 (x30 y118 w920 h492 → 30~950, 下610) ========== -->
  <g id="选卡面板">
    <rect x="30" y="118" width="920" height="492" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="30" y="118" width="920" height="492" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="30" y="118" width="920" height="4" fill="#FF4655" fill-opacity="0.80"/>

    <!-- 卡牌网格 2行x5列: 卡160x200, 列间隔20 行间隔20, 内容区 x60~920(860宽) y148~568 -->
    <!-- 列x: 60, 240, 420, 600, 780; 行y: 148, 368 -->

    <!-- ===== 行1 ===== -->
    <!-- 卡1 (选中态: 红色描边) -->
    <rect x="60" y="148" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="60" y="148" width="160" height="200" fill="none" stroke="#FF4655" stroke-width="2.5" rx="8"/>
    <text x="140" y="258" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 1</text>

    <!-- 卡2 -->
    <rect x="235" y="148" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="235" y="148" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="315" y="258" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 2</text>

    <!-- 卡3 -->
    <rect x="410" y="148" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="410" y="148" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="490" y="258" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 3</text>

    <!-- 卡4 -->
    <rect x="585" y="148" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="585" y="148" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="665" y="258" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 4</text>

    <!-- 卡5 -->
    <rect x="760" y="148" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="760" y="148" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="840" y="258" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 5</text>

    <!-- ===== 行2 ===== -->
    <!-- 卡6 -->
    <rect x="60" y="368" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="60" y="368" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="140" y="478" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 6</text>

    <!-- 卡7 -->
    <rect x="235" y="368" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="235" y="368" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="315" y="478" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 7</text>

    <!-- 卡8 -->
    <rect x="410" y="368" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="410" y="368" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="490" y="478" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 8</text>

    <!-- 卡9 -->
    <rect x="585" y="368" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="585" y="368" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="665" y="478" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 9</text>

    <!-- 卡10 -->
    <rect x="760" y="368" width="160" height="200" fill="#FFFFFF" fill-opacity="0.10" rx="8"/>
    <rect x="760" y="368" width="160" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>
    <text x="840" y="478" font-size="16" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡牌占位 10</text>
  </g>

  <!-- ========== 右侧卡组预览面板 (x980 y118 w270 h492 → 980~1250, 下610) ========== -->
  <g id="卡组预览面板">
    <rect x="980" y="118" width="270" height="492" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="980" y="118" width="270" height="492" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="980" y="118" width="270" height="4" fill="#FF4655" fill-opacity="0.80"/>

    <!-- 卡组预览信息区 -->
    <rect x="1000" y="148" width="230" height="432" fill="#FFFFFF" fill-opacity="0.06" rx="8"/>
    <text x="1115" y="365" font-size="18" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">卡组预览</text>
    <text x="1115" y="395" font-size="14" fill="#FFFFFF" fill-opacity="0.40" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">已选卡牌信息占位</text>
  </g>

  <!-- ========== 底部信息栏 (640~720) ========== -->
  <g id="底部信息栏">
    <rect x="0" y="640" width="1280" height="80" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="0" y="640" width="1280" height="2" fill="#FFFFFF" fill-opacity="0.60"/>

    <text x="0" y="628" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">v0.1.0</text>

    <rect x="0" y="642" width="170" height="78" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="49" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">玩家名称</text>
    <rect x="168" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>

    <rect x="170" y="642" width="170" height="39" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="241" y="666" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">等级</text>
    <rect x="170" y="679" width="170" height="2" fill="#FFFFFF" fill-opacity="0.60"/>
    <rect x="170" y="681" width="170" height="39" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="241" y="705" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">经验</text>
    <rect x="339" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>

    <text x="616" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>
    <text x="726" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>
    <text x="836" y="688" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">货币 XXX</text>

    <rect x="1200" y="642" width="2" height="78" fill="#FFFFFF" fill-opacity="0.60"/>
    <rect x="1202" y="642" width="78" height="78" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="1229" y="683" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', sans-serif">设置</text>
  </g>
</svg>